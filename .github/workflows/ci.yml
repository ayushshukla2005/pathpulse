name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies & ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          pip install -r apps/ai-service/requirements.txt

      - name: Build internal packages
        run: pnpm build:packages

      - name: Generate Prisma Client
        run: pnpm --filter @pathpulse/api exec prisma generate

      - name: Check code formatting
        run: pnpm format:check

      - name: Run Node linters
        run: pnpm lint

      - name: Run Python linter (ruff)
        run: |
          cd apps/ai-service
          ruff check .

      - name: Run TypeScript typecheck
        run: pnpm typecheck

  test-unit:
    name: Unit Tests (Matrix)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/ai-service/requirements.txt

      - name: Build internal packages
        run: pnpm build:packages

      - name: Generate Prisma Client
        run: pnpm --filter @pathpulse/api exec prisma generate

      - name: Run API Unit Tests
        run: pnpm --filter @pathpulse/api test

      - name: Run Web Unit Tests
        run: pnpm --filter @pathpulse/web test

      - name: Run AI Service Tests
        run: |
          cd apps/ai-service
          pytest tests -v

  test-integration:
    name: Integration & E2E Tests
    needs: [lint-and-typecheck, test-unit]
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: pathpulse
          POSTGRES_USER: pathpulse
          POSTGRES_PASSWORD: pathpulse_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate CI environment file
        run: |
          JWT_ACCESS=$(openssl rand -hex 32)
          echo "::add-mask::$JWT_ACCESS"
          JWT_REFRESH=$(openssl rand -hex 32)
          echo "::add-mask::$JWT_REFRESH"
          SEED_PASS=$(openssl rand -hex 16)
          echo "::add-mask::$SEED_PASS"
          COOKIE_SEC=$(openssl rand -hex 32)
          echo "::add-mask::$COOKIE_SEC"
          AI_TOKEN=ci-token-$(openssl rand -hex 16)
          echo "::add-mask::$AI_TOKEN"
          printf "DATABASE_URL=postgresql://pathpulse:pathpulse_dev_password@localhost:5432/pathpulse\nREDIS_URL=redis://localhost:6379\nWEB_ORIGIN=http://localhost:3000\nAPI_PORT=4000\nAPI_INTERNAL_URL=http://localhost:4000\nJWT_ACCESS_SECRET=%s\nJWT_REFRESH_SECRET=%s\nSEED_ADMIN_PASSWORD=%s\nCOOKIE_SECRET=%s\nS3_ENDPOINT=http://localhost:9000\nS3_REGION=us-east-1\nS3_BUCKET=pathpulse-evidence\nS3_ACCESS_KEY_ID=pathpulse_admin\nS3_SECRET_ACCESS_KEY=pathpulse_secret_key\nS3_FORCE_PATH_STYLE=true\nAI_SERVICE_URL=http://localhost:8000\nAI_SERVICE_TOKEN=%s\n" "$JWT_ACCESS" "$JWT_REFRESH" "$SEED_PASS" "$COOKIE_SEC" "$AI_TOKEN" > .env
          cp .env apps/api/.env
          cat .env >> "$GITHUB_ENV"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers with OS dependencies
        run: pnpm --filter @pathpulse/web exec playwright install --with-deps chromium

      - name: Build internal packages
        run: pnpm build:packages

      - name: Generate Prisma Client
        run: pnpm --filter @pathpulse/api exec prisma generate

      - name: Run Prisma Migrations
        run: pnpm --filter @pathpulse/api migrate:deploy

      - name: Seed Database
        run: pnpm --filter @pathpulse/api db:seed

      - name: Run API E2E & Integration Tests
        run: pnpm --filter @pathpulse/api test:e2e

      - name: Build API
        run: pnpm --filter @pathpulse/api build

      - name: Start API
        run: |
          node apps/api/dist/main.js &
          for i in {1..30}; do
            if curl -s -f http://localhost:4000/api/v1/health; then
              echo "API is ready"
              exit 0
            fi
            sleep 1
          done
          echo "API failed to start within 30 seconds"
          exit 1

      - name: Build Web Application
        run: pnpm --filter @pathpulse/web build

      - name: Run Playwright E2E and Axe Scans
        env:
          CI: true
        run: pnpm --filter @pathpulse/web test:e2e

      - name: Stop API
        if: always()
        run: |
          pkill -f "dist/main.js" || true

  docker-build:
    name: Build Production Docker Images
    needs: [lint-and-typecheck, test-unit, test-integration]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: pathpulse
          POSTGRES_USER: pathpulse
          POSTGRES_PASSWORD: pathpulse_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate CI environment file
        run: |
          JWT_ACCESS=$(openssl rand -hex 32)
          echo "::add-mask::$JWT_ACCESS"
          JWT_REFRESH=$(openssl rand -hex 32)
          echo "::add-mask::$JWT_REFRESH"
          SEED_PASS=$(openssl rand -hex 16)
          echo "::add-mask::$SEED_PASS"
          COOKIE_SEC=$(openssl rand -hex 32)
          echo "::add-mask::$COOKIE_SEC"
          printf "DATABASE_URL=postgresql://pathpulse:pathpulse_dev_password@localhost:5432/pathpulse\nREDIS_URL=redis://localhost:6379\nWEB_ORIGIN=http://localhost:3000\nAPI_PORT=4000\nJWT_ACCESS_SECRET=%s\nJWT_REFRESH_SECRET=%s\nSEED_ADMIN_PASSWORD=%s\nCOOKIE_SECRET=%s\n" "$JWT_ACCESS" "$JWT_REFRESH" "$SEED_PASS" "$COOKIE_SEC" > .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: pathpulse-api:ci

      - name: Build Web Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: pathpulse-web:ci

      - name: Build AI Service Docker Image
        uses: docker/build-push-action@v5
        with:
          context: apps/ai-service
          file: apps/ai-service/Dockerfile
          push: false
          tags: pathpulse-ai-service:ci

  deploy:
    name: Production Deployment
    needs: [lint-and-typecheck, test-unit, test-integration, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check deployment configuration
        id: check-secrets
        env:
          RENDER_API_DEPLOY_HOOK: ${{ secrets.RENDER_API_DEPLOY_HOOK }}
          RENDER_AI_DEPLOY_HOOK: ${{ secrets.RENDER_AI_DEPLOY_HOOK }}
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$RENDER_API_DEPLOY_HOOK" ] && [ -z "$RENDER_AI_DEPLOY_HOOK" ] && [ -z "$VERCEL_DEPLOY_HOOK" ] && [ -z "$DATABASE_URL" ]; then
            echo "has_secrets=false" >> $GITHUB_OUTPUT
            echo "Notice: Deployment secrets are not configured in this environment. Skipping deployment."
          else
            echo "has_secrets=true" >> $GITHUB_OUTPUT
          fi

      - name: Checkout repository
        if: steps.check-secrets.outputs.has_secrets == 'true'
        uses: actions/checkout@v4

      - name: Setup pnpm
        if: steps.check-secrets.outputs.has_secrets == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - name: Setup Node.js
        if: steps.check-secrets.outputs.has_secrets == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Install dependencies
        if: steps.check-secrets.outputs.has_secrets == 'true'
        run: pnpm install --frozen-lockfile

      - name: Run Production Database Migration Job
        if: steps.check-secrets.outputs.has_secrets == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -n "$DATABASE_URL" ]; then
            pnpm --filter @pathpulse/api migrate:deploy
          fi

      - name: Trigger Render Deploy Hook (API)
        if: steps.check-secrets.outputs.has_secrets == 'true'
        env:
          RENDER_API_DEPLOY_HOOK: ${{ secrets.RENDER_API_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_API_DEPLOY_HOOK" ]; then
            curl -f -X POST "${RENDER_API_DEPLOY_HOOK}"
          fi

      - name: Trigger Render Deploy Hook (AI Service)
        if: steps.check-secrets.outputs.has_secrets == 'true'
        env:
          RENDER_AI_DEPLOY_HOOK: ${{ secrets.RENDER_AI_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_AI_DEPLOY_HOOK" ]; then
            curl -f -X POST "${RENDER_AI_DEPLOY_HOOK}"
          fi

      - name: Trigger Vercel Deploy Hook (Web)
        if: steps.check-secrets.outputs.has_secrets == 'true'
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -n "$VERCEL_DEPLOY_HOOK" ]; then
            curl -f -X POST "${VERCEL_DEPLOY_HOOK}"
          fi
