services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: pathpulse-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pathpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pathpulse_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-pathpulse}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - prod_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pathpulse} -d ${POSTGRES_DB:-pathpulse}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: pathpulse-prod-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - prod_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  minio:
    image: minio/minio
    container_name: pathpulse-prod-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-pathpulse_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-pathpulse_secret_key}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - prod_minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  ai-service:
    build:
      context: ./apps/ai-service
      dockerfile: Dockerfile
    container_name: pathpulse-prod-ai
    restart: unless-stopped
    environment:
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-dev-pathpulse-ai-internal-service-token-secret}
      PORT: 8000
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: pathpulse-prod-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://pathpulse:pathpulse_dev_password@postgres:5432/pathpulse}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      AI_SERVICE_URL: http://ai-service:8000
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-dev-pathpulse-ai-internal-service-token-secret}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-this-is-a-valid-access-secret-32-chars-long}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-this-is-a-valid-refresh-secret-32-chars-long}
      COOKIE_SECRET: ${COOKIE_SECRET:-dev-pathpulse-cookie-secret-minimum-32-chars}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      API_PORT: 4000
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: pathpulse-evidence
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-pathpulse_admin}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-pathpulse_secret_key}
      S3_FORCE_PATH_STYLE: "true"
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: pathpulse-prod-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
      API_BASE_URL: http://api:4000/api/v1
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  prod_postgres_data:
  prod_redis_data:
  prod_minio_data:
